name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate GitHub Actions
        run: |
          set -euo pipefail
          actionlint_version="1.7.12"
          actionlint_checksum="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL \
            -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${actionlint_version}/actionlint_${actionlint_version}_linux_amd64.tar.gz"
          printf '%s  %s\n' "${actionlint_checksum}" /tmp/actionlint.tar.gz | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color

      - name: Test release tooling
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 -m py_compile scripts/*.py

  linux-release-compatibility:
    name: Linux release compatibility
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: linux-release-compatibility

      - name: Build Linux release binary
        run: >
          cargo build --release --locked --target x86_64-unknown-linux-gnu
          -p unpin-cli

      - name: Verify Linux release artifact compatibility
        shell: bash
        run: >
          scripts/verify_linux_release_artifact.sh
          target/x86_64-unknown-linux-gnu/release/unpin

  rust:
    name: Rust (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-24.04
            quality_gates: true
          - platform: macOS
            runner: macos-15
            quality_gates: false
          - platform: Windows
            runner: windows-2025
            quality_gates: false
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Check formatting
        if: matrix.quality_gates
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        if: matrix.platform != 'Windows'
        run: cargo test --workspace --all-features --locked

      - name: Test Windows platform boundary
        if: matrix.platform == 'Windows'
        run: |
          cargo test -p unpin-core --lib --all-features --locked windows_
          cargo test -p unpin-core --lib --all-features --locked open_file_identity_rejects_a_replaced_path
          cargo test -p unpin-core --test state --all-features --locked writes_fail_closed_without_private_permission_support

      - name: Check CLI surface
        run: cargo run -p unpin-cli --locked -- --help

  msrv:
    name: Rust 1.96.1 MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.96.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: msrv

      - name: Test minimum supported Rust version
        run: |
          cargo +1.96.1 test --workspace --all-targets --all-features --locked
          cargo +1.96.1 test --workspace --doc --all-features --locked

  msrv-windows:
    name: Rust 1.96.1 MSRV (Windows)
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.96.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: msrv-windows

      - name: Check minimum supported Rust version
        run: cargo +1.96.1 test --workspace --all-targets --all-features --locked --no-run

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1

      - name: Install dependency checks
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2,cargo-machete@0.9.2

      - name: Audit dependencies
        run: cargo audit --deny warnings

      - name: Enforce dependency policy
        run: cargo deny check

      - name: Check unused dependencies
        run: cargo machete
