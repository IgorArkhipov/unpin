name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Verify tag matches package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          package_version="$(
            cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "unpin-cli") | .version'
          )"
          test "v${release_version}" = "${GITHUB_REF_NAME}"
          test "${release_version}" = "${package_version}"
          printf 'value=%s\n' "${release_version}" >> "${GITHUB_OUTPUT}"

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p unpin-cli --bins

      - name: Verify GNU/Linux release artifact compatibility
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          scripts/verify_linux_release_artifact.sh \
            target/x86_64-unknown-linux-gnu/release/unpin
          scripts/verify_linux_release_artifact.sh \
            target/x86_64-unknown-linux-gnu/release/unpin-credential-broker

      - name: Install SBOM generator
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: Generate target SBOM
        shell: bash
        run: |
          set -euo pipefail
          cargo cyclonedx \
            --manifest-path crates/unpin-cli/Cargo.toml \
            --format json \
            --describe binaries \
            --all-features \
            --target "${{ matrix.target }}" \
            --target-in-filename \
            --spec-version 1.5

      - name: Package release
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="$(
            scripts/package_release.sh \
              "${{ matrix.target }}" \
              "${{ steps.version.outputs.value }}" \
              dist
          )"
          sbom="crates/unpin-cli/unpin_bin_${{ matrix.target }}.cdx.json"
          test -f "${sbom}"
          sbom_output="dist/unpin-v${{ steps.version.outputs.value }}-${{ matrix.target }}.cdx.json"
          mv "${sbom}" "${sbom_output}"
          printf 'archive=%s\n' "${archive}" >> "${GITHUB_OUTPUT}"
          printf 'sbom=%s\n' "${sbom_output}" >> "${GITHUB_OUTPUT}"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Attest archive SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.package.outputs.archive }}
          sbom-path: ${{ steps.package.outputs.sbom }}

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  build-macos:
    name: Build macOS CLI ${{ matrix.target }}
    environment: release-signing
    env:
      UNPIN_CODESIGN_IDENTITY: ${{ vars.UNPIN_CODESIGN_CERTIFICATE_SHA1 }}
      UNPIN_CODESIGN_EXPECTED_FINGERPRINT: ${{ vars.UNPIN_CODESIGN_CERTIFICATE_SHA1 }}
      UNPIN_CODESIGN_CERTIFICATE_SHA1: ${{ vars.UNPIN_CODESIGN_CERTIFICATE_SHA1 }}
      UNPIN_CODESIGN_TIMESTAMP_MODE: none
      UNPIN_REQUIRE_STABLE_CODESIGN: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Verify tag matches package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          package_version="$(
            cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "unpin-cli") | .version'
          )"
          test "v${release_version}" = "${GITHUB_REF_NAME}"
          test "${release_version}" = "${package_version}"
          printf 'value=%s\n' "${release_version}" >> "${GITHUB_OUTPUT}"

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p unpin-cli --bins

      - name: Install SBOM generator
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: Generate target SBOM
        shell: bash
        run: |
          set -euo pipefail
          cargo cyclonedx \
            --manifest-path crates/unpin-cli/Cargo.toml \
            --format json \
            --describe binaries \
            --all-features \
            --target "${{ matrix.target }}" \
            --target-in-filename \
            --spec-version 1.5

      - name: Import stable macOS signing identity
        env:
          UNPIN_MACOS_SIGNING_CERTIFICATE_P12: ${{ secrets.UNPIN_MACOS_SIGNING_CERTIFICATE_P12 }}
          UNPIN_MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.UNPIN_MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: scripts/import_macos_signing_identity.sh

      - name: Package signed release
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="$(
            scripts/package_release.sh \
              "${{ matrix.target }}" \
              "${{ steps.version.outputs.value }}" \
              dist
          )"
          sbom="crates/unpin-cli/unpin_bin_${{ matrix.target }}.cdx.json"
          test -f "${sbom}"
          sbom_output="dist/unpin-v${{ steps.version.outputs.value }}-${{ matrix.target }}.cdx.json"
          mv "${sbom}" "${sbom_output}"
          printf 'archive=%s\n' "${archive}" >> "${GITHUB_OUTPUT}"
          printf 'sbom=%s\n' "${sbom_output}" >> "${GITHUB_OUTPUT}"

      - name: Remove stable macOS signing identity
        if: always()
        run: scripts/cleanup_macos_signing_identity.sh

      - name: Verify signed macOS CLI artifact
        if: success()
        shell: bash
        run: |
          scripts/verify_macos_release_artifact.sh \
            "${{ steps.package.outputs.archive }}" \
            "${{ matrix.target }}" \
            "${{ steps.version.outputs.value }}"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Attest archive SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.package.outputs.archive }}
          sbom-path: ${{ steps.package.outputs.sbom }}

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  desktop:
    name: Build desktop ${{ matrix.target }}
    environment: release-signing
    env:
      UNPIN_CODESIGN_IDENTITY: ${{ vars.UNPIN_CODESIGN_CERTIFICATE_SHA1 }}
      UNPIN_CODESIGN_EXPECTED_FINGERPRINT: ${{ vars.UNPIN_CODESIGN_CERTIFICATE_SHA1 }}
      UNPIN_CODESIGN_CERTIFICATE_SHA1: ${{ vars.UNPIN_CODESIGN_CERTIFICATE_SHA1 }}
      UNPIN_CODESIGN_TIMESTAMP_MODE: none
      UNPIN_REQUIRE_STABLE_CODESIGN: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          key: release-desktop-${{ matrix.target }}

      - name: Verify tag matches CLI and desktop versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          package_version="$(
            cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "unpin-cli") | .version'
          )"
          desktop_version="$(
            xcodebuild -showBuildSettings \
              -project apps/unpin-desktop/UnpinDesktop.xcodeproj \
              -scheme UnpinDesktop \
              -configuration Release \
              | awk '$1 == "MARKETING_VERSION" { print $3; exit }'
          )"
          test "v${release_version}" = "${GITHUB_REF_NAME}"
          test "${release_version}" = "${package_version}"
          test "${release_version}" = "${desktop_version}"
          printf 'value=%s\n' "${release_version}" >> "${GITHUB_OUTPUT}"

      - name: Build unsigned desktop workbench
        id: build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "${GITHUB_SHA}")"
          export SOURCE_DATE_EPOCH
          staged_app="$(
            scripts/build_desktop_release.sh \
              "${{ matrix.target }}" \
              "${{ steps.version.outputs.value }}" \
              dist \
              build-only
          )"
          if [[ -z "${staged_app}" || "${staged_app}" == *$'\n'* || "${staged_app}" == *$'\r'* || ! -d "${staged_app}" || -L "${staged_app}" ]]; then
            echo "unsigned desktop builder must print one existing app bundle path" >&2
            exit 1
          fi
          printf 'app=%s\n' "${staged_app}" >> "${GITHUB_OUTPUT}"

      - name: Import stable macOS signing identity
        env:
          UNPIN_MACOS_SIGNING_CERTIFICATE_P12: ${{ secrets.UNPIN_MACOS_SIGNING_CERTIFICATE_P12 }}
          UNPIN_MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.UNPIN_MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: scripts/import_macos_signing_identity.sh

      - name: Sign and package desktop workbench
        id: package
        shell: bash
        run: |
          set -euo pipefail
          archive="$(
            scripts/sign_desktop_release.sh \
              "${{ matrix.target }}" \
              "${{ steps.version.outputs.value }}" \
              dist
          )"
          if [[ -z "${archive}" || "${archive}" == *$'\n'* || "${archive}" == *$'\r'* || ! -f "${archive}" || -L "${archive}" ]]; then
            echo "desktop release builder must print one existing archive path" >&2
            exit 1
          fi
          printf 'archive=%s\n' "${archive}" >> "${GITHUB_OUTPUT}"

      - name: Remove stable macOS signing identity
        if: always()
        run: scripts/cleanup_macos_signing_identity.sh

      - name: Verify signed desktop artifact
        if: success()
        shell: bash
        run: |
          scripts/verify_desktop_release_artifact.sh \
            "${{ steps.package.outputs.archive }}" \
            "${{ matrix.target }}" \
            "${{ steps.version.outputs.value }}"

      - name: Install SBOM generator
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: Generate desktop SBOM
        id: sbom
        shell: bash
        run: |
          set -euo pipefail
          cargo cyclonedx \
            --manifest-path crates/unpin-cli/Cargo.toml \
            --format json \
            --describe binaries \
            --all-features \
            --target "${{ matrix.target }}" \
            --target-in-filename \
            --spec-version 1.5
          source_sbom="crates/unpin-cli/unpin_bin_${{ matrix.target }}.cdx.json"
          desktop_sbom="dist/unpin-desktop-v${{ steps.version.outputs.value }}-${{ matrix.target }}.cdx.json"
          jq --arg version "${{ steps.version.outputs.value }}" '
            .metadata.component.name = "unpin-desktop" |
            .metadata.component.version = $version |
            .metadata.component.type = "application" |
            .metadata.component.properties = ((.metadata.component.properties // []) + [
              {"name": "unpin:distribution", "value": "macOS desktop workbench"},
              {"name": "unpin:embedded-binary", "value": "unpin"}
            ])
          ' "${source_sbom}" > "${desktop_sbom}"
          printf 'path=%s\n' "${desktop_sbom}" >> "${GITHUB_OUTPUT}"

      - name: Attest desktop build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Attest desktop archive SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.package.outputs.archive }}
          sbom-path: ${{ steps.sbom.outputs.path }}

      - name: Upload desktop release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-desktop-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  draft:
    name: Create draft release
    needs: [build, build-macos, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 -- *.tar.gz *.cdx.json > SHA256SUMS

      - name: Create or refresh draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "${notes}"
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            test "$(
              gh release view "${GITHUB_REF_NAME}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json isDraft \
                --jq '.isDraft'
            )" = "true"
            gh release view "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets \
              --jq '.assets[].name' \
              | python3 scripts/check_release_assets.py reject-evidence
            gh release upload "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            prerelease_args=()
            if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
              prerelease_args+=(--prerelease)
            fi
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --draft \
              "${prerelease_args[@]}" \
              --title "Unpin ${GITHUB_REF_NAME}" \
              --notes-file "${notes}"
          fi
