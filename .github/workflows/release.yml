name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Verify tag matches package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          package_version="$(
            cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "unpin-cli") | .version'
          )"
          test "v${release_version}" = "${GITHUB_REF_NAME}"
          test "${release_version}" = "${package_version}"
          printf 'value=%s\n' "${release_version}" >> "${GITHUB_OUTPUT}"

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p unpin-cli

      - name: Install SBOM generator
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: Generate target SBOM
        shell: bash
        run: |
          set -euo pipefail
          cargo cyclonedx \
            --manifest-path crates/unpin-cli/Cargo.toml \
            --format json \
            --describe binaries \
            --all-features \
            --target "${{ matrix.target }}" \
            --target-in-filename \
            --spec-version 1.5

      - name: Package release
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="$(
            scripts/package_release.sh \
              "${{ matrix.target }}" \
              "${{ steps.version.outputs.value }}" \
              dist
          )"
          sbom="crates/unpin-cli/unpin_bin_${{ matrix.target }}.cdx.json"
          test -f "${sbom}"
          sbom_output="dist/unpin-v${{ steps.version.outputs.value }}-${{ matrix.target }}.cdx.json"
          mv "${sbom}" "${sbom_output}"
          printf 'archive=%s\n' "${archive}" >> "${GITHUB_OUTPUT}"
          printf 'sbom=%s\n' "${sbom_output}" >> "${GITHUB_OUTPUT}"

      - name: Attest build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Attest archive SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: ${{ steps.package.outputs.archive }}
          sbom-path: ${{ steps.package.outputs.sbom }}

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  draft:
    name: Create draft prerelease
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create or refresh draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "${notes}"
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            test "$(
              gh release view "${GITHUB_REF_NAME}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json isDraft \
                --jq '.isDraft'
            )" = "true"
            gh release upload "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --draft \
              --prerelease \
              --title "Unpin ${GITHUB_REF_NAME}" \
              --notes-file "${notes}"
          fi
